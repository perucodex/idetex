<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#0d1117"/>
  <!-- Top accent stripe -->
  <rect x="0" y="0" width="512" height="8" rx="4" fill="#f59e0b" opacity="0.9"/>

  <!-- Header row (column labels) -->
  <rect x="40" y="32" width="432" height="44" rx="8" fill="#1a2030"/>
  <rect x="148" y="40" width="80" height="28" rx="6" fill="#f59e0b" opacity="0.22"/>
  <rect x="240" y="40" width="80" height="28" rx="6" fill="#f59e0b" opacity="0.16"/>
  <rect x="332" y="40" width="80" height="28" rx="6" fill="#f59e0b" opacity="0.10"/>
  <rect x="424" y="40" width="48" height="28" rx="6" fill="#f59e0b" opacity="0.07"/>

  <!-- Vertical grid lines -->
  <line x1="148" y1="76" x2="148" y2="420" stroke="#ffffff" stroke-width="1" opacity="0.07"/>
  <line x1="228" y1="76" x2="228" y2="420" stroke="#ffffff" stroke-width="1" opacity="0.07"/>
  <line x1="308" y1="76" x2="308" y2="420" stroke="#ffffff" stroke-width="1" opacity="0.07"/>
  <line x1="388" y1="76" x2="388" y2="420" stroke="#ffffff" stroke-width="1" opacity="0.07"/>
  <line x1="468" y1="76" x2="468" y2="420" stroke="#ffffff" stroke-width="1" opacity="0.07"/>

  <!-- Row label backgrounds -->
  <rect x="40" y="88"  width="98" height="34" rx="5" fill="#1a2030"/>
  <rect x="40" y="136" width="98" height="34" rx="5" fill="#1a2030"/>
  <rect x="40" y="184" width="98" height="34" rx="5" fill="#1a2030"/>
  <rect x="40" y="232" width="98" height="34" rx="5" fill="#1a2030"/>
  <rect x="40" y="280" width="98" height="34" rx="5" fill="#1a2030"/>
  <rect x="40" y="328" width="98" height="34" rx="5" fill="#1a2030"/>

  <!-- Gantt Bar 1: amber (a tiempo) -->
  <rect x="152" y="90"  width="192" height="30" rx="8" fill="#f59e0b"/>
  <rect x="152" y="90"  width="192" height="14" rx="8" fill="#fbbf24" opacity="0.4"/>

  <!-- Gantt Bar 2: green (terminado) -->
  <rect x="184" y="138" width="228" height="30" rx="8" fill="#10b981"/>
  <rect x="184" y="138" width="228" height="14" rx="8" fill="#34d399" opacity="0.4"/>

  <!-- Gantt Bar 3: red (retrasado) -->
  <rect x="152" y="186" width="132" height="30" rx="8" fill="#ef4444"/>
  <rect x="152" y="186" width="132" height="14" rx="8" fill="#f87171" opacity="0.4"/>

  <!-- Gantt Bar 4: blue (info) -->
  <rect x="208" y="234" width="216" height="30" rx="8" fill="#3b82f6"/>
  <rect x="208" y="234" width="216" height="14" rx="8" fill="#60a5fa" opacity="0.4"/>

  <!-- Gantt Bar 5: purple -->
  <rect x="168" y="282" width="156" height="30" rx="8" fill="#8b5cf6"/>
  <rect x="168" y="282" width="156" height="14" rx="8" fill="#a78bfa" opacity="0.4"/>

  <!-- Gantt Bar 6: amber lighter -->
  <rect x="152" y="330" width="172" height="30" rx="8" fill="#f59e0b" opacity="0.72"/>
  <rect x="152" y="330" width="172" height="14" rx="8" fill="#fbbf24" opacity="0.3"/>

  <!-- Today marker -->
  <line x1="318" y1="76" x2="318" y2="420" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,4" opacity="0.75"/>
  <polygon points="304,76 332,76 318,94" fill="#f59e0b" opacity="0.95"/>
  <circle cx="318" cy="94" r="5" fill="#f59e0b" opacity="0.9"/>

  <!-- Bottom summary bars -->
  <rect x="40" y="438" width="432" height="10" rx="5" fill="#1a2030"/>
  <rect x="40" y="438" width="260" height="10" rx="5" fill="#f59e0b" opacity="0.45"/>

  <rect x="40" y="458" width="432" height="8" rx="4" fill="#1a2030"/>
  <rect x="40" y="458" width="340" height="8" rx="4" fill="#10b981" opacity="0.35"/>

  <rect x="40" y="476" width="432" height="8" rx="4" fill="#1a2030"/>
  <rect x="40" y="476" width="140" height="8" rx="4" fill="#ef4444" opacity="0.4"/>
</svg>
